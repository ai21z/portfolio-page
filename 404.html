<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Page not found | Aris Zounarakis</title>
  <meta name="description" content="The requested page could not be found." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#07090a" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <style>
    @font-face {
      font-family: "Special Elite";
      src: url("/artifacts/fonts/SpecialElite-Regular.woff2") format("woff2");
      font-display: swap;
    }

    @font-face {
      font-family: "Literata";
      src: url("/artifacts/fonts/literata-400.woff2") format("woff2");
      font-display: swap;
    }

    @font-face {
      font-family: "JetBrains Mono";
      src: url("/artifacts/fonts/jetbrains-mono-400.woff2") format("woff2");
      font-display: swap;
    }

    @font-face {
      font-family: "Literata Fallback";
      src: local("Georgia");
      size-adjust: 104.41%;
      ascent-override: 112.73%;
      descent-override: 29.5%;
      line-gap-override: 0%;
    }

    /* The chrome tokens of styles/base.css, which this page does not load. */
    :root {
      --chrome-ink: rgba(230, 227, 216, 0.7);
      --chrome-ink-hi: rgba(242, 239, 232, 0.96);
      --chrome-rule: rgba(230, 227, 216, 0.3);
      --chrome-rule-hi: rgba(230, 227, 216, 0.66);
      --chrome-back: rgba(8, 9, 10, 0.84);
      --chrome-track: 0.16em;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      overflow: hidden;
      color: var(--chrome-ink-hi);
      background: #07090a url("/artifacts/bg_base.webp") center / cover no-repeat;
      font-family: "Special Elite", Georgia, serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 7, 0.84);
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 640px);
      text-align: center;
    }

    /* The rust seal as on the hub and the phone menu, its dark ground screened away. */
    .seal {
      width: clamp(104px, 24vw, 156px);
      height: auto;
      margin-bottom: 18px;
      opacity: 0.9;
      mix-blend-mode: screen;
    }

    .code {
      margin: 0 auto 8px;
      color: var(--chrome-ink);
      font: 400 12px/1.2 "JetBrains Mono", ui-monospace, Consolas, monospace;
      letter-spacing: 0.24em;
    }

    h1 {
      margin: 0;
      color: var(--chrome-ink-hi);
      font-size: clamp(2rem, 7vw, 4.4rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      max-width: 42ch;
      margin: 18px auto 28px;
      color: var(--chrome-ink);
      font: 1rem/1.65 "Literata", "Literata Fallback", Georgia, serif;
    }

    /* A stamp in the chrome ink, as Back and the Graphics control are on the site. */
    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid var(--chrome-rule);
      border-radius: 2px;
      color: var(--chrome-ink-hi);
      background: var(--chrome-back);
      font: 400 12px/1 "JetBrains Mono", ui-monospace, Consolas, monospace;
      text-transform: uppercase;
      letter-spacing: var(--chrome-track);
      text-decoration: none;
    }

    a:hover { border-color: var(--chrome-rule-hi); }
    a:focus-visible { outline: 1px solid var(--chrome-rule-hi); outline-offset: 3px; }

  </style>
</head>
<body>
  <main>
    <img class="seal" src="/artifacts/sigil/no-bg-seal-sigil-512.webp" alt="" width="156" height="156" />
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The address does not lead to a page on this site.</p>
    <a href="/">Return to zounarakis.com</a>
  </main>
</body>
</html>
